services:
  tempchat:
    build:
      context: "https://github.com/WiaderekB/TempChat.git#main"
    restart: unless-stopped
    init: true
    ports:
      - "3087:3087"
    environment:
      APP_URL: "https://rooms.wiaderek.xyz"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Ustaw ADMIN_PASSWORD w zmiennych stacka}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-}"
    volumes:
      - rooms_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=768m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3087/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rooms_data:
